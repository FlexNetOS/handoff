[package]
name = "ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "RVF vector-native ledger v2 (rusqlite fallback) with semantic recall over session history"

[dependencies]
work-order = { path = "../work-order" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
# Primary: RVF vector-native store for semantic recall
rvf-runtime = { path = "../../RuVector/crates/rvf/rvf-runtime", default-features = false, features = ["std"], optional = true }
rvf-index = { path = "../../RuVector/crates/rvf/rvf-index", features = ["std"], optional = true }
rvf-types = { path = "../../RuVector/crates/rvf/rvf-types", optional = true }
# Fallback: rusqlite + rvf-crypto witness chain (v1)
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
rvf-crypto = { path = "../../RuVector/crates/rvf/rvf-crypto", features = ["std"], optional = true }

[features]
default = ["v2"]
# v1 fallback: rusqlite + rvf-crypto witness chain (no RVF runtime)
v1 = ["dep:rusqlite", "dep:rvf-crypto"]
# v2 default: RVF vector-native semantic recall layered over the proven v1 store
v2 = ["v1", "dep:rvf-runtime", "dep:rvf-index", "dep:rvf-types"]
