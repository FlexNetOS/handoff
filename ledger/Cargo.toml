[package]
name = "ledger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure-Rust handoff ledger: redb authoritative event store + native-RVF semantic recall overlay"

[dependencies]
work-order = { path = "../work-order" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
# Authoritative store: pure-Rust ACID single-writer serializable KV (no -sys / no C).
redb = { version = "4", optional = true }
# RVF vector-native semantic-recall overlay (v2). Pure Rust.
rvf-runtime = { path = "../../meta-ruvector/crates/rvf/rvf-runtime", default-features = false, features = ["std"], optional = true }
rvf-index = { path = "../../meta-ruvector/crates/rvf/rvf-index", features = ["std"], optional = true }
rvf-types = { path = "../../meta-ruvector/crates/rvf/rvf-types", optional = true }
# Witness chain (tamper-evidence). Pure Rust (no rvf-runtime/napi).
rvf-crypto = { path = "../../meta-ruvector/crates/rvf/rvf-crypto", features = ["std"], optional = true }
# One-time migration importer ONLY (never in the default graph): reads a legacy C-SQLite
# ledger.db and streams it into redb. Opt-in via the `legacy-sqlite` feature.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
# Default keeps the v2 RVF recall overlay (parity with the pre-port default) — now redb-backed
# and C-free. `redb-store` alone (no overlay) is available for minimal/embedded builds.
default = ["v2"]
# Authoritative pure-Rust store (redb) + the witness chain. No C, no -sys.
redb-store = ["dep:redb", "dep:rvf-crypto"]
# v2: RVF vector-native semantic recall layered over the redb authoritative store.
v2 = ["redb-store", "dep:rvf-runtime", "dep:rvf-index", "dep:rvf-types"]
# One-time migration importer ONLY — pulls in bundled C-SQLite. NEVER default.
legacy-sqlite = ["redb-store", "dep:rusqlite"]

[lints]
workspace = true
