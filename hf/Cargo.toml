[package]
name = "hf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "hf — the .handoff continuity CLI (S1 spike: init/seed/claim/checkpoint/handoff/resume)"

[[bin]]
name = "hf"
path = "src/main.rs"

[[bin]]
name = "hf-mcp"
path = "src/bin/hf-mcp.rs"

[dependencies]
work-order = { path = "../work-order" }
ledger = { path = "../ledger" }
handoff-core = { path = "../handoff-core" }
handoff-policy = { path = "../handoff-policy" }
# HFTASK-0081 (ADR-0019 D5 #4): the handoff.task.v1 runtime validator (PRD §7.3/§23) was peeled
# into the `handoff-schema` crate (which owns the jsonschema dep); hf aliases it as `schema`.
handoff-schema = { path = "../handoff-schema" }
# HFTASK-0081 (ADR-0019 D5 #4): the weave-coordinated claim-lease bridge (HFTASK-0048) was peeled
# into the `handoff-lease` crate; hf aliases it as `lease`.
handoff-lease = { path = "../handoff-lease" }
# HFTASK-0083 (ADR-0019 D5 #4): the typed hook contract was peeled into `handoff-hooks`
# (the first coupled module, after the shared helpers moved to handoff-core); hf aliases it as `hooks`.
handoff-hooks = { path = "../handoff-hooks" }
# HFTASK-0083 (ADR-0019 D5 #4): the index/plan maps were peeled into `handoff-index`; hf aliases as `index`.
handoff-index = { path = "../handoff-index" }
# HFTASK-0083 (ADR-0019 D5 #4): fleet rollup aggregation was peeled into `handoff-fleet`; hf aliases as `fleet`.
handoff-fleet = { path = "../handoff-fleet" }
# HFTASK-0083 (ADR-0019 D5 #4): the drift-audit + policy-check engine was peeled into `handoff-drift`; hf aliases as `gates`.
handoff-drift = { path = "../handoff-drift" }
# HFTASK-0083: the AI gatekeeper (+ GhPrView) was peeled into `handoff-gatekeeper`; hf aliases as `gatekeeper`.
handoff-gatekeeper = { path = "../handoff-gatekeeper" }
# HFTASK-0083: the front-door intake/dispatch verbs were peeled into `handoff-intake`; hf aliases as `intake`.
handoff-intake = { path = "../handoff-intake" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HFTASK-0004 (ADR-0011): the real RuVector formal-verification crate — proof-carrying
# AgentContract attestation (lean-agentic Eq.refl proofs + tamper-evident ProofAttestation
# that serializes into an RVF WITNESS_SEG). Path dep mirrors `ledger`'s rvf-crypto: the
# FlexNetOS workspace checkout is the sibling `meta-ruvector/`, so standalone builds resolve
# the real repository name instead of requiring the legacy mixed-case alias.
ruvector-verified = { path = "../../meta-ruvector/crates/ruvector-verified", default-features = false }
# HFTASK-0018 (ADR-0012): RuVector's contextual Thompson bandit for highest-value next-task
# routing. default-features off (its default is empty; RVF integration stays optional) → only
# serde/thiserror/rand. Path dep, crates-only, CI-safe (same as the other RuVector crates).
ruvector-domain-expansion = { path = "../../meta-ruvector/crates/ruvector-domain-expansion", default-features = false }
rand = "0.8"
# HFTASK-0083: the envctl secrets merge-gate moved into `handoff-secrets` (optional, behind the
# `secrets` feature). main's `policy gate` path calls it directly; the gatekeeper crate has its own.
handoff-secrets = { path = "../handoff-secrets", optional = true }
# HFTASK-0017 (ADR-0001 R13): cognitum-gate-tilezero — RuVector coherence-gate arbiter for
# in-loop action decisions (Permit/Defer/Deny) witnessed into the ledger.
cognitum-gate-tilezero = { path = "../../meta-ruvector/crates/cognitum-gate-tilezero", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
# HFTASK-0083 (ADR-0019 D5 #4): routing/ledger ops resolved into `handoff-route`; hf aliases as `route`.
handoff-route = { path = "../handoff-route" }

[dev-dependencies]
# HFTASK-0083: the cwd-serialization test mutex is shared across the kernel crates.
handoff-test-support = { path = "../handoff-test-support" }

[features]
default = ["cognitum"]
# Enable the experimental secrets-engine seam (merge-gate decision helper, relay prep).
# Propagates to the gatekeeper crate's own secrets feature + hf's direct handoff-secrets use.
secrets = ["dep:handoff-secrets", "handoff-gatekeeper/secrets"]
# Enable the cognitum-gate action governor behind `hf policy gate`.
cognitum = ["dep:cognitum-gate-tilezero", "dep:tokio"]
# Build the one-time legacy C-SQLite → redb ledger importer (`hf migrate`). Pulls bundled
# C-SQLite for the read side — NEVER part of the default no-C runtime build (ADR-0017 cutover).
legacy-sqlite = ["ledger/legacy-sqlite"]

[lints]
workspace = true
