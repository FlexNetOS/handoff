[package]
name = "hf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "hf — the .handoff continuity CLI (S1 spike: init/seed/claim/checkpoint/handoff/resume)"

[[bin]]
name = "hf"
path = "src/main.rs"

[dependencies]
work-order = { path = "../work-order" }
ledger = { path = "../ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HFTASK-0004 (ADR-0011): the dependent-type Lean kernel that `ruvector-verified` is itself
# built on — published + dep-free, so handoff's standalone CI stays self-contained (a path
# dep to RuVector's unpublished `ruvector-verified` would break the independent build).
lean-agentic = "=0.1.0"
