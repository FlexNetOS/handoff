[package]
name = "hf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "hf — the .handoff continuity CLI (S1 spike: init/seed/claim/checkpoint/handoff/resume)"

[[bin]]
name = "hf"
path = "src/main.rs"

[dependencies]
work-order = { path = "../work-order" }
ledger = { path = "../ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
