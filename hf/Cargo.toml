[package]
name = "hf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "hf — the .handoff continuity CLI (S1 spike: init/seed/claim/checkpoint/handoff/resume)"

[[bin]]
name = "hf"
path = "src/main.rs"

[dependencies]
work-order = { path = "../work-order" }
ledger = { path = "../ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HFTASK-0004 (ADR-0011): the real RuVector formal-verification crate — proof-carrying
# AgentContract attestation (lean-agentic Eq.refl proofs + tamper-evident ProofAttestation
# that serializes into an RVF WITNESS_SEG). Path dep mirrors `ledger`'s rvf-crypto: handoff
# CI clones FlexNetOS/meta-ruvector as the sibling `RuVector/` (.github/workflows/ci.yml), so
# the standalone build resolves it. default-features off → no ruvector-core/napi pulled in.
ruvector-verified = { path = "../../RuVector/crates/ruvector-verified", default-features = false }
