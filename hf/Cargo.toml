[package]
name = "hf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "hf — the .handoff continuity CLI (S1 spike: init/seed/claim/checkpoint/handoff/resume)"

[[bin]]
name = "hf"
path = "src/main.rs"

[[bin]]
name = "hf-mcp"
path = "src/bin/hf-mcp.rs"

[dependencies]
work-order = { path = "../work-order" }
ledger = { path = "../ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HFTASK-0057 (PRD §7.3/§23): runtime validation of a card's raw JSON against the
# schemars-generated handoff.task.v1 schema, so a schema-violating card (missing intent_lock,
# bad id, wrong `schema` const) is rejected loudly at load instead of silently dropped.
# default-features off drops the reqwest/TLS resolvers — we validate against an in-memory
# schema with no remote `$ref` resolution, so no HTTP machinery is needed (lean, offline).
jsonschema = { version = "0.46", default-features = false }
# HFTASK-0004 (ADR-0011): the real RuVector formal-verification crate — proof-carrying
# AgentContract attestation (lean-agentic Eq.refl proofs + tamper-evident ProofAttestation
# that serializes into an RVF WITNESS_SEG). Path dep mirrors `ledger`'s rvf-crypto: handoff
# CI clones FlexNetOS/meta-ruvector as the sibling `RuVector/` (.github/workflows/ci.yml), so
# the standalone build resolves it. default-features off → no ruvector-core/napi pulled in.
ruvector-verified = { path = "../../RuVector/crates/ruvector-verified", default-features = false }
# HFTASK-0018 (ADR-0012): RuVector's contextual Thompson bandit for highest-value next-task
# routing. default-features off (its default is empty; RVF integration stays optional) → only
# serde/thiserror/rand. Path dep, crates-only, CI-safe (same as the other RuVector crates).
ruvector-domain-expansion = { path = "../../RuVector/crates/ruvector-domain-expansion", default-features = false }
rand = "0.8"
# HFTASK-0013 (ADR-0001 §9.5/R10): envctl secrets-engine — optional until the relay-bearer
# and child-env injection paths are fully wired. default-features off keeps the build lean.
envctl-secrets-engine = { path = "../../envctl/crates/secrets-engine", default-features = false, features = ["inmem-store"], optional = true }
# HFTASK-0017 (ADR-0001 R13): cognitum-gate-tilezero — RuVector coherence-gate arbiter for
# in-loop action decisions (Permit/Defer/Deny) witnessed into the ledger.
cognitum-gate-tilezero = { path = "../../RuVector/crates/cognitum-gate-tilezero", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
default = ["cognitum"]
# Enable the experimental secrets-engine seam (merge-gate decision helper, relay prep).
secrets = ["dep:envctl-secrets-engine"]
# Enable the cognitum-gate action governor behind `hf policy gate`.
cognitum = ["dep:cognitum-gate-tilezero", "dep:tokio"]
# Build the one-time legacy C-SQLite → redb ledger importer (`hf migrate`). Pulls bundled
# C-SQLite for the read side — NEVER part of the default no-C runtime build (ADR-0017 cutover).
legacy-sqlite = ["ledger/legacy-sqlite"]
