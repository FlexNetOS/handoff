name: Qodana

# ADR-0018 D9: advisory JetBrains inspection lane. This is intentionally NOT a required
# check; failures surface IDE/static-analysis debt without blocking the autonomous merge path.

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  qodana:
    name: Qodana (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: handoff

      - name: Clone rvf-crypto provider (meta-ruvector)
        run: git clone --depth 1 https://github.com/FlexNetOS/meta-ruvector.git RuVector

      - name: Clone envctl provider (envctl)
        run: git clone --depth 1 https://github.com/FlexNetOS/envctl.git envctl

      - name: Qodana scan
        continue-on-error: true
        uses: JetBrains/qodana-action@v2026.1.3
        with:
          project-dir: handoff
          args: --config,qodana.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
