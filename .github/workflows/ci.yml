      - name: Clone rvf-crypto provider (meta-ruvector)
        shell: bash
        run: |
          # Sparse checkout avoids Windows-invalid paths in meta-ruvector (for example
          # `.codex/prompts/agents:agent-capabilities.md`) while preserving the exact
