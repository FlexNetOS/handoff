          mkdir meta-ruvector
          git -C meta-ruvector init
          # Windows rejects colon-bearing paths anywhere in the fetched tree before
          # sparse-checkout has a chance to exclude them. Keep sparse parity and
          # disable only the Windows path-protection validation for this throwaway
          # provider checkout; skipped invalid paths are never materialized.
          git -C meta-ruvector config core.protectNTFS false
