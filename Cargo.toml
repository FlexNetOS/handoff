[workspace]
resolver = "2"
members = ["work-order", "ledger", "hf", "crates/cli", "crates/core", "crates/runner", "crates/spec", "crates/tui"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
authors = ["FlexNetOS <team@flexnetos.com>"]
homepage = "https://github.com/FlexNetOS/handoff"
repository = "https://github.com/FlexNetOS/handoff"
documentation = "https://docs.rs/handoff"

# We host syntect locally and upgrade its dead dependencies ourselves (owner directive,
# 2026-06-26). `vendor/syntect` is a FlexNetOS fork of syntect master (rev 4aa78031, which had
# already moved off the unmaintained `yaml-rust 0.4` -> maintained `yaml-rust2`) with the
# unmaintained `bincode` (RUSTSEC-2025-0141, permanently frozen, ALL versions flagged) REPLACED
# by the maintained `postcard` for the .packdump/.themedump format. The bundled `assets/*` were
# regenerated in postcard format. Result: BOTH unmaintained advisories are gone from the tree
# (not suppressed). syntect is still package-version 5.3.0, so this satisfies tui-markdown's
# `^5.3.0` requirement. See docs/rusty-idd/security-advisories.md for the fork rationale and the
# upstream-reconcile exit condition (drop the fork when syntect 6.0.0 ships its own bincode
# replacement, trishume/syntect#623/#694).
[patch.crates-io]
syntect = { path = "vendor/syntect" }
