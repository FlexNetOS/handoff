# handoff.policy.v1 — loop policy for the Continuity Ledger Kernel (ADR-0001 §1).
# Read by `hf session` (preflight + worktree), `hf ship`/merge (remote+merge), `hf sync`.
# Missing keys fall back to the compiled defaults in hf/src/policy.rs.

# Trunk-name reconcile (HFTASK-0076 / ADR-0018 D11): the directive names `main`; this repo (and
# the whole 60-repo fleet + live branch protection) is on `master`. Decision applied everywhere:
# **`master` is the canonical trunk, `main` is a documented alias** — the card-authorized
# lower-risk path. A fleet-wide rename would touch account-level branch protection (an owner wall)
# and the live pipeline; the alias path needs no code change because `BranchPolicy::is_trunk()`
# already treats both `master` and `main` as the trunk. Set `trunk_branch = "main"` here (and the
# workflows accordingly) if/when the fleet ever standardizes on `main`.
[remote]
model        = "clone"            # "clone" | "fork"
origin       = "FlexNetOS/handoff"
base_branch  = "develop"          # branch sessions/worktrees start from
trunk_branch = "master"           # protected trunk PRs target (canonical; `main` is its alias)
develop_mirrors_trunk = true      # promote develop→trunk on merge (`hf promote`, auto at `hf done --pr`)

[loop]
wrap_strategy   = "context"       # ADR-0018 D3: "context" (budget) | "tasks" (legacy fixed count)
context_budget_pct = 50           # wrap (checkpoint→handoff) at ~50% of the context window
cycle_flush     = 4               # upper safety bound on tasks/cycle (caps a runaway cycle)
batch_checkout  = true            # `hf claim --batch N` (≤ cycle_flush)
worktree_prefix = "handoff-"      # session worktree/branch prefix

[merge]
require_review = true
reviewer       = "cloud_ultra"    # Phase 1; Phase 2 = "swarm_local"
auto_merge     = "on_approve"
permission_gate = true            # transitional → AI gatekeeper (HFTASK-0014)
# ADR-0018 D8: branch protection must require the AI gatekeeper as a STATUS CHECK,
# never as a bot APPROVE (gh-aw #25439). sync-master.yml still waits only for the
# four push checks on develop; the gatekeeper check is PR-scoped and protects merge.
required_status_checks = ["Test (ubuntu-latest)", "Test (macos-latest)", "Clippy", "Format", "AI Gatekeeper"]

[preflight]
require_clean_tree  = true        # refuse session start on a dirty tree
require_synced_base = true        # refuse if base is behind origin (drift)
refuse_legacy_weave = true        # only the lease-capable weave is accepted

[sync]
kb_enabled   = true               # one-way ledger → .kb write-back
kb_slugs     = ["context/overridable/active", "context/overridable/progress"]
meta_register = true              # idempotent .meta.yaml/.gitignore ensure
