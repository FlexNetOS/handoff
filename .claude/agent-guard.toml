# Agent Guard Configuration
# Schema Version: 1.0
# Location: .claude/agent-guard.toml (project) or ~/.claude/agent-guard.toml (user)
#
# This file configures which destructive command patterns are detected by the
# agent guard system. Each pattern can be enabled/disabled and have custom
# denial messages.

schema_version = "1.0"

[metadata]
source = "handoff"
version = "0.1.0"
description = "Default agent guard patterns for the handoff continuity kernel"

[[patterns]]
id = "handoff.git.force_push"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+push.*(--force|-f)\b' }
validator = { type = "not_contains", value = "--force-with-lease" }
message = """
git push --force can overwrite shared history. Safer alternatives:
- git push --force-with-lease (checks for upstream changes)
- hf ship (the supported promotion path)
"""

[[patterns]]
id = "handoff.git.reset_hard"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+reset.*--hard\b' }
message = """
git reset --hard destroys uncommitted work. Safer alternatives:
- git checkout -- <file> (revert specific files)
- git restore --staged <file> (unstage)
"""

[[patterns]]
id = "handoff.git.clean_force"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+clean' }
validator = { type = "flags_present", command = "clean", flags = ["f", "d"] }
message = """
git clean -fd removes untracked files and directories permanently. Safer alternatives:
- git clean -nd (dry run — preview what would be removed)
- remove specific files instead of recursive cleans
"""

[[patterns]]
id = "handoff.git.checkout_dot"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+checkout\s+(--\s+)?\.(\s|$)' }
message = """
git checkout . reverts all modified files. Safer alternatives:
- git checkout -- <specific-file> (target specific files)
- git restore -- <specific-file>
"""

[[patterns]]
id = "handoff.git.branch_force_delete"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+branch.*\s+-D\b' }
message = """
git branch -D force-deletes branches, potentially losing unmerged work. Safer alternatives:
- git branch -d <branch> (safe delete — only works if merged)
- git branch -v to check merge status first
"""

[[patterns]]
id = "handoff.git.stash_drop"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+stash\s+drop\b' }
message = """
git stash drop permanently removes a stash entry. Safer alternatives:
- git stash list to review what will be dropped
- git stash show <stash> to inspect contents first
- git stash apply <stash> instead of pop (preserves the stash)
"""

[[patterns]]
id = "handoff.git.stash_clear"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'git\s+stash\s+clear\b' }
message = """
git stash clear removes ALL stash entries permanently. Safer alternatives:
- git stash list to review what will be cleared
- git stash drop <stash> to remove specific entries one at a time
"""

[[patterns]]
id = "handoff.rm.dangerous_paths"
priority = 100
enabled = true
matcher = { type = "regex", pattern = 'rm\s+' }
validator = { type = "all_of", validators = [{ type = "flags_present", command = "rm", flags = ["r", "f"] }, { type = "args_match_any", command = "rm", values = [".", "..", "/", "~", "$HOME", ".handoff", ".github", ".claude", "*", "./*", "../*", "./"] }] }
message = """
rm -rf on dangerous paths could destroy repo roots or workspace data. Safer alternatives:
- Remove specific files instead of entire directories
- Use git clean for tracked-repository cleanup
"""

# File-pattern rules: deny handoff-style markdown outside .handoff/ (ADR-0004 §1).
[[file_patterns]]
id = "handoff.handoff.adhoc_handoff_md"
enabled = true
applies_to = ["Write", "Edit"]
basename_regex = '^(?:[A-Z0-9_-]*HANDOFF[A-Z0-9_-]*|[A-Z0-9_-]+-PROMPT[A-Z0-9_-]*)\.md$'
allow_if_path_contains = [".handoff/"]
only_new_files = true
message = """
Hand-written handoff/mission-prompt markdown outside .handoff/ is deprecated
(ADR-0004 §1, policy P7.36) — the kernel is the only handoff path. Instead:
- hf checkpoint + hf handoff — render the next-session packet into .handoff/packets/
- hf task mint — turn a kb doc into a witnessed task card
Existing files stay editable (grandfathered). Rendered packets belong under .handoff/.
"""
