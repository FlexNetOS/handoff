# cargo-audit configuration (read by `cargo audit` and the rustsec/audit-check CI action).
#
# Policy: NOTHING is ignored here. Vulnerabilities are never ignored, and every UNMAINTAINED
# advisory we hit has been FIXED upgrade-only, not suppressed:
#
#   - RUSTSEC-2024-0320 (yaml-rust unmaintained)  -> FIXED: the `[patch.crates-io] syntect`
#     vendored fork moves syntect onto the maintained `yaml-rust2`.
#   - RUSTSEC-2025-0141 (bincode unmaintained)    -> FIXED: the same vendored fork replaces
#     bincode with the maintained `postcard` for the dump format (assets regenerated).
#
# Both crates are gone from the dependency tree (verify: `cargo tree -i yaml-rust` /
# `cargo tree -i bincode` both report "did not match any packages"). See
# docs/rusty-idd/security-advisories.md. If either reappears, that is a real regression and
# `cargo audit` SHOULD fail — do not add an `ignore` here to paper over it.

[advisories]
ignore = []
